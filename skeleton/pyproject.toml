[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorlynot-skeleton"
version = "3.0.0"
description = "ShorlyNot Quantum Security Skeleton: ShorlyNot-QDS-T1 Teleportation QDS & Q-STDF Threat Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Egreen Quanta - SIH 2026 Team" }
]
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "kyber-py>=1.0.0",
    "dilithium-py>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
shorlynot = "shorlynot_skeleton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
